<div #fupucarousel class="fupucarousel" [class.fupuvertical]="vertical.enabled">
  <ng-content select="[fupuCarouselPrev]"></ng-content>
  <div class="fupu-container">
    <div #touchContainer class="fupu-touch-container">
      <div #fupuItemsContainer class="fupucarousel-items">
        <ng-container fupuCarouselOutlet></ng-container>
      </div>
    </div>
  </div>
  <div class="fupuclearFix"></div>
  <ng-content select="[fupuCarouselNext]"></ng-content>
</div>
<ng-content select="[fupuCarouselPoint]"></ng-content>
