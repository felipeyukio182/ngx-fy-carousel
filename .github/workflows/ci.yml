name: CI

on:
  push:
    branches: [angular-20, angular-21, angular-22]
  pull_request:
    branches: [angular-20, angular-21, angular-22]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build library
        run: npm run build:lib
